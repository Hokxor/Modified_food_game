<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Pantry Catch | Eat Better, Spend Less</title>
  <style>
    :root {
      --color-navy: #001C2A;
      --color-orange: #FCA911;
      --color-green: #18803C;
      --color-soft-blue: #C9E2E9;
      --color-white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-navy);
      color: var(--color-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background-image: radial-gradient(rgba(201, 226, 233, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .game-card {
      width: 100%;
      max-width: 460px;
      background: var(--color-white);
      border: 4px solid var(--color-navy);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      color: var(--color-navy);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header { text-align: center; border-bottom: 3px dashed var(--color-navy); padding-bottom: 10px; }
    header h1 { font-size: 1.4rem; color: var(--color-navy); text-transform: uppercase; }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      background: var(--color-navy);
      color: var(--color-white);
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 4/5;
      background-color: var(--color-soft-blue);
      border: 3px solid var(--color-navy);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas { width: 100%; height: 100%; display: block; }

    .tip-box {
      background-color: var(--color-orange);
      color: var(--color-navy);
      padding: 10px;
      border-radius: 8px;
      border: 2px solid var(--color-navy);
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <header>
      <h1>Pattern Pantry Catch</h1>
      <p style="font-size: 0.8rem; font-weight: bold;">Student Budget Cooking Game</p>
    </header>

    <div class="hud-bar">
      <div>Score: <span id="score" style="color: #4ADE80;">0</span></div>
      <div>Target: <span id="target-item" style="color: var(--color-orange);">Broccoli 🥦</span></div>
      <div>Saved: <span id="budget" style="color: #4ADE80;">$0.00</span></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="400" height="500"></canvas>
    </div>

    <div class="tip-box" id="tip-display">
      💡 Drag screen or use ⬅️ ➡️ arrow keys to catch high-contrast healthy ingredients!
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let budgetSaved = 0;
    
    const player = { x: 160, y: 440, width: 80, height: 30, dx: 0 };
    const recipeTargets = [
      { name: "Broccoli 🥦", type: "broccoli", tip: "💡 Frozen broccoli retains nutrients and costs half as much as fresh." },
      { name: "Salmon 🐟", type: "salmon", tip: "💡 Canned salmon provides quick omega-3 protein for easy dorm meals." },
      { name: "Rice Bowl 🍚", type: "rice", tip: "💡 Bulk rice is an affordable foundation for any student meal." },
      { name: "Boiled Egg 🥚", type: "egg", tip: "💡 Eggs are one of the most cost-effective proteins available." }
    ];

    let currentTargetIdx = 0;
    const fallingItems = [];

    function drawBroccoli(x, y) {
      ctx.fillStyle = "#18803C";
      ctx.beginPath();
      ctx.arc(x + 15, y + 10, 12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSalmon(x, y) {
      ctx.fillStyle = "#FF7A59";
      ctx.beginPath();
      ctx.ellipse(x + 15, y + 10, 15, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRiceBowl(x, y) {
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.arc(x + 15, y + 10, 10, Math.PI, 0);
      ctx.fill();
    }

    function drawEgg(x, y) {
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.ellipse(x + 15, y + 10, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#F59E0B";
      ctx.beginPath();
      ctx.arc(x + 15, y + 10, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function spawnItem() {
      const types = ["broccoli", "salmon", "rice", "egg"];
      fallingItems.push({
        x: Math.random() * (canvas.width - 30),
        y: -20,
        type: types[Math.floor(Math.random() * types.length)],
        speed: 3
      });
    }

    function update() {
      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const item = fallingItems[i];
        item.y += item.speed;

        if (
          item.y + 20 >= player.y &&
          item.x + 20 >= player.x &&
          item.x <= player.x + player.width
        ) {
          const currentTarget = recipeTargets[currentTargetIdx];

          if (item.type === currentTarget.type) {
            score += 100;
            budgetSaved += 2.50;
            document.getElementById("tip-display").innerHTML = currentTarget.tip;
            currentTargetIdx = (currentTargetIdx + 1) % recipeTargets.length;
            document.getElementById("target-item").innerText = recipeTargets[currentTargetIdx].name;
          }

          document.getElementById("score").innerText = score;
          document.getElementById("budget").innerText = `$${budgetSaved.toFixed(2)}`;
          fallingItems.splice(i, 1);
        } else if (item.y > canvas.height) {
          fallingItems.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#001C2A";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      fallingItems.forEach(item => {
        if (item.type === "broccoli") drawBroccoli(item.x, item.y);
        else if (item.type === "salmon") drawSalmon(item.x, item.y);
        else if (item.type === "rice") drawRiceBowl(item.x, item.y);
        else if (item.type === "egg") drawEgg(item.x, item.y);
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") player.dx = -7;
      if (e.key === "ArrowRight") player.dx = 7;
    });

    document.addEventListener("keyup", () => player.dx = 0);

    canvas.addEventListener("touchmove", e => {
      const rect = canvas.getBoundingClientRect();
      player.x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width) - player.width / 2;
    });

    setInterval(spawnItem, 1000);
    gameLoop();
  </script>
</body>
</html>
